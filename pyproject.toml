[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puhis"
version = "0.1.24"
description = "Windows-ääninäppäimistö ja -avustin paikallisella puheentunnistuksella"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.1.0",
    "SpeechRecognition>=3.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
